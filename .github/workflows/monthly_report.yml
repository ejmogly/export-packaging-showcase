name: Monthly Operations Email Dispatcher

on:
  schedule:
    # 1. End-of-Month Pre-check (28th-31st of every month at 11:50 UTC = 20:50 KST)
    - cron: '50 11 28-31 * *'
    # 2. Monthly Closing Dispatch (1st of every month at 00:00 UTC = 09:00 KST)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  dispatch-monthly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and Send Monthly Operations Report
        env:
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: |
          # Use GitHub event schedule context to reliably distinguish precheck from 1st-of-month dispatch
          if [ "${{ github.event.schedule }}" = "50 11 28-31 * *" ]; then
            echo "Running end-of-month pre-flight readiness check (20:50 KST)..."
            python -m src.reporting.email_reporter --precheck
          elif [ "${{ github.event.schedule }}" = "0 0 1 * *" ]; then
            echo "Running monthly operations closing dispatch (09:00 KST on 1st)..."
            python -m src.reporting.email_reporter
          else
            echo "Manual or fallback trigger (event: ${{ github.event_name }})..."
            python -m src.reporting.email_reporter
          fi
